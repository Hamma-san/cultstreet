<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CultStreet | Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="institutional-page">
    <header class="site-header solid">
        <a class="logo" href="index.html">CultStreet</a>
        <nav class="nav"><a href="catalogo.html">Loja</a><a href="login.html">Entrar</a><a href="checkout.html">Carrinho</a></nav>
    </header>
    <main class="account-shell">
        <section class="account-panel">
            <span>Comunidade CultStreet</span>
            <h1>CRIAR CONTA</h1>
            <p>Faça parte do movimento e acompanhe sua experiência com a marca.</p>
            <form class="account-form" data-register-form>
                <label>Nome completo<input type="text" name="name" required autocomplete="name"></label>
                <label>E-mail<input type="email" name="email" required autocomplete="email"></label>
                <label>Senha<input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
                <button class="btn btn-light" type="submit">CRIAR CONTA</button>
                <p class="form-message" data-form-message></p>
            </form>
            <a class="account-switch" href="login.html">Já possui conta? Entrar.</a>
        </section>
    </main>
    <script src="account.js"></script>
</body>
</html>
