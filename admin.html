<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CultStreet | Administração</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="institutional-page">
    <header class="site-header solid">
        <a class="logo" href="index.html">CultStreet</a>
        <nav class="nav"><a href="index.html">Ver site</a><a href="perfil.html">Perfil</a><button class="nav-button" type="button" data-logout>Sair</button></nav>
    </header>
    <main class="admin-shell">
        <header class="admin-heading"><span>Área restrita</span><h1>PAINEL CULTSTREET</h1><p>Edite a vitrine sem alterar arquivos do site.</p></header>
        <section class="admin-section">
            <div class="admin-section-title"><span>01</span><h2>Página inicial</h2></div>
            <form class="admin-content-form" data-content-form>
                <label>Chamada superior<input name="hero_eyebrow" required></label>
                <label>Título principal<textarea name="hero_title" rows="3" required></textarea></label>
                <label>Descrição principal<textarea name="hero_description" rows="3" required></textarea></label>
                <label>Título do manifesto<textarea name="manifesto_title" rows="3" required></textarea></label>
                <label>Texto do manifesto<textarea name="manifesto_text" rows="5" required></textarea></label>
                <button class="btn btn-light" type="submit">SALVAR HOME</button>
            </form>
        </section>
        <section class="admin-section">
            <div class="admin-section-title"><span>02</span><h2>Produtos</h2></div>
            <div class="admin-products" data-admin-products></div>
        </section>
        <div class="admin-toast" data-admin-message></div>
    </main>
    <script src="admin.js"></script>
</body>
</html>
