<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CultStreet | Meu perfil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="institutional-page">
    <header class="site-header solid">
        <a class="logo" href="index.html">CultStreet</a>
        <nav class="nav"><a href="catalogo.html">Loja</a><a href="checkout.html">Carrinho</a><button class="nav-button" type="button" data-logout>Sair</button></nav>
    </header>
    <main class="account-shell">
        <section class="account-panel account-panel-wide">
            <span>Conta CultStreet</span>
            <h1>MEU PERFIL</h1>
            <form class="account-form" data-profile-form>
                <label>Nome completo<input type="text" name="name" required autocomplete="name"></label>
                <label>E-mail<input type="email" name="email" readonly></label>
                <label>WhatsApp<input type="tel" name="phone" autocomplete="tel"></label>
                <button class="btn btn-light" type="submit">SALVAR ALTERAÇÕES</button>
                <p class="form-message" data-form-message></p>
            </form>
            <a class="btn btn-gold is-hidden" href="admin.html" data-admin-link>ABRIR PAINEL ADMINISTRATIVO</a>
        </section>
    </main>
    <script src="account.js"></script>
</body>
</html>
